[build-system]
requires = ["setuptools>=69.0", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "tutopy"
version = "0.0.1"
authors = [
  { name="Jordi Berbis", email="jberbis@xtec.cat" },
]
description = "Una eina per al seguiment d'alumnes en centres educatius"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6==6.11.1",
  "openpyxl>=3.1,<4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-qt>=4.0",
  "tomli>=2.0; python_version < '3.11'",
]
build = [
  "pyinstaller==6.21.0",
  "Pillow>=10,<13",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
tutopy = "tutopy.main:main"

[tool.setuptools.packages.find]
include = ["tutopy*"]

[project.urls]
"Homepage" = "https://github.com/jberbissbd/seguiment"
"Bug Tracker" = "https://github.com/jberbissbd/seguiment/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
