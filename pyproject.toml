[build-system]
requires = ["setuptools>=69.0", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "tutopy"
version = "1.2.0"
authors = [
  { name="Jordi Berbis", email="jberbis@xtec.cat" },
]
description = "Una eina per al seguiment d'alumnes en centres educatius"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography==49.0.0",
  "PySide6==6.11.1",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
  "odfpy==1.4.1",
  "reportlab==5.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-cov==5.0.0",
  "pytest-qt==4.5.0",
  "tomli==2.0.1; python_version < '3.11'",
]
build = [
  "setuptools==84.0.0",
  "pyinstaller==6.21.0",
  "macholib==1.16.4; sys_platform == 'darwin'",
  "pefile==2024.8.26; sys_platform == 'win32'",
  "Pillow==12.3.0",
  "pywin32-ctypes==0.2.3; sys_platform == 'win32'",
  "tomli==2.0.1; python_version < '3.11'",
]

[project.scripts]
tutopy = "tutopy.main:main"

[tool.setuptools.packages.find]
include = ["tutopy*"]

[project.urls]
"Homepage" = "https://github.com/jberbissbd/seguiment"
"Bug Tracker" = "https://github.com/jberbissbd/seguiment/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: proves aïllades sense persistència ni UI real",
  "integration: proves que connecten diverses capes o recursos reals",
  "ui: proves de widgets i fluxos Qt executades en mode offscreen",
]

[tool.coverage.run]
source = ["tutopy"]
branch = true
relative_files = true

[tool.coverage.report]
omit = [
  "shibokensupport/*",
  "*/shibokensupport/*",
  "signature_bootstrap.py",
  "*/signature_bootstrap.py",
]
