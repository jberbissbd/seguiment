name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install Qt dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-glx libxkbcommon-x11-0 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libegl1
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install project without resolving dependencies
        run: python -m pip install --no-deps -e .
      - name: Validate installed dependencies
        run: python -m pip check
      - name: Run tests with coverage
        run: python -m pytest -q --cov=tutopy --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Compile Python sources
        run: python -m compileall -q tutopy
      - name: Read project version
        id: project
        run: echo "version=$(python scripts/project_version.py)" >> "$GITHUB_OUTPUT"
      - name: SonarQube Cloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.project.outputs.version }}
