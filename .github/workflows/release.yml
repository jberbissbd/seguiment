name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Qt dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-glx libxkbcommon-x11-0 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libegl1
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Validate tag and project version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release_version.py "$RELEASE_TAG"
      - name: Run tests
        run: python -m pytest -q

  build:
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            source: dist/Tutopy.exe
            filename: Tutopy-Windows-x86_64.exe
            artifact: tutopy-windows-x86_64
          - os: ubuntu-22.04
            source: dist/Tutopy
            filename: Tutopy-Linux-x86_64
            artifact: tutopy-linux-x86_64
          - os: macos-15-intel
            source: dist/Tutopy
            filename: Tutopy-macOS-x86_64
            artifact: tutopy-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Build one-file executable
        run: pyinstaller --clean --noconfirm tutopy.spec
      - name: Stage release artifact
        env:
          SOURCE_FILE: ${{ matrix.source }}
          OUTPUT_FILE: ${{ matrix.filename }}
        run: python scripts/stage_release_artifact.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v5.0.0
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          pattern: tutopy-*
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum Tutopy-* > SHA256SUMS.txt
      - name: Create release and upload executables
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "Tutopy $RELEASE_TAG"
